[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photokin"
version = "0.6.0"
description = "Photo metadata from vision LLMs: verbatim transcription of what's written on scans, plus captions, keywords, and cautious date/location guesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Sielen", email = "asielen@gmail.com" }]
keywords = ["photo", "metadata", "exif", "xmp", "lightroom", "llm", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "pillow>=11.0.0",
]

[project.optional-dependencies]
openai = ["openai>=2.6.1"]
anthropic = ["anthropic>=0.39.0"]
gemini = ["google-genai>=0.7.0"]
all = ["photokin[openai,anthropic,gemini]"]
# PyYAML is a TEST-ONLY dependency and must never be imported by the package:
# photokin/doc_sidecar.py hand-writes the small YAML subset a sidecar's
# frontmatter needs (quoted scalars, flow lists, one flat flow map). It is here
# so the round-trip cases that prove that emitter valid actually run -- without
# it they importorskip, and a serializer whose only proof is skipped in CI is a
# serializer with no proof at all.
dev = ["photokin[all]", "pytest>=8", "ruff", "mypy", "build", "twine", "pyyaml"]

[project.scripts]
photokin = "photokin.cli:main"

[project.urls]
Homepage = "https://github.com/asielen/photokin"
Repository = "https://github.com/asielen/photokin"

[tool.setuptools]
# MANIFEST.in now ships photokin/tests and tests/ so the sdist carries its own
# suite (see MANIFEST.in). Without this, setuptools' automatic package-data
# discovery treats every MANIFEST.in-matched file inside a package directory
# as package data regardless of packages.find's exclude below, and the wheel
# -- which is meant to exclude tests -- picks them back up too. Explicit
# [tool.setuptools.package-data] entries are unaffected by this flag.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["photokin*"]
exclude = ["photokin.tests*", "tests*"]

[tool.setuptools.package-data]
photokin = [
  "py.typed",
  "prompts_photo_ai/*.txt",
  "prompts_photo_ai/*.toml",
  "prompts_photo_ai/schema/*.json",
]
# ExifTool is intentionally NOT vendored in the wheel (it would put a ~34 MB
# Windows-only Perl distribution into a py3-none-any package installed on every
# platform). It is downloaded on demand by photokin.exiftool.fetch; see that
# module and photokin/exiftool/README.md.

[tool.pytest.ini_options]
testpaths = ["photokin/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
