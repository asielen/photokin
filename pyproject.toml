[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photokin"
version = "0.1.0"
description = "LLM-based photo metadata analysis and enrichment (provider-agnostic; usable standalone or from the MEL Lightroom plugin)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Sielen", email = "asielen@gmail.com" }]
keywords = ["photo", "metadata", "exif", "xmp", "lightroom", "llm", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "pillow>=11.0.0",
  "keyring>=24.0",
]

[project.optional-dependencies]
openai = ["openai>=2.6.1"]
anthropic = ["anthropic>=0.39.0"]
gemini = ["google-genai>=0.7.0"]
all = ["photokin[openai,anthropic,gemini]"]
dev = ["photokin[all]", "pytest>=8", "ruff", "mypy", "build", "twine"]

[project.scripts]
photokin = "photokin.cli:main"

[project.urls]
Homepage = "https://github.com/asielen/MetadataEnrichmentLightroom"
Repository = "https://github.com/asielen/MetadataEnrichmentLightroom"

[tool.setuptools.packages.find]
where = ["."]
include = ["photokin*"]
exclude = ["photokin.tests*", "tests*"]

[tool.setuptools.package-data]
photokin = [
  "prompts_photo_ai/*.txt",
  "prompts_photo_ai/*.toml",
  "prompts_photo_ai/schema/*.json",
]

[tool.pytest.ini_options]
testpaths = ["photokin/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
