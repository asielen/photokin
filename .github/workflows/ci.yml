name: ci

# Run the test suite on every push and pull request, across the OSes and
# Python versions the package claims to support.
on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
