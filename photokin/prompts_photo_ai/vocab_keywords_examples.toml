# Reference-only section: examples of the mandatory "DATE: <pattern>" system
# keyword so it is never treated as a new keyword. Never propose additions here.
[date_reference]
keywords = [
  "DATE: Y!",
  "DATE: Y~",
  "DATE: Y?",
  "DATE: Y!M!D!",
  "DATE: Y!M!",
  "DATE: Y!M~",
  "DATE: Y!M!D~",
  "DATE: Y~M~",
]
